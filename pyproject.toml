[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ip-guard"
version = "0.1.0"
description = "Autoriza ou bloqueia IPs a partir de regras"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ip-guard = "ip_guard.interface.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
